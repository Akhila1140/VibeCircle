<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeCircle</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">◉ <span>VibeCircle</span></div>

      <nav>
        <button class="nav-item active" data-page="home">🏠 <span>Home</span></button>
        <button class="nav-item" data-page="explore">🔎 <span>Explore</span></button>
        <button class="nav-item" data-page="rooms">🟣 <span>Moment Rooms</span></button>
        <button class="nav-item" data-page="quests">🎯 <span>Social Quests</span></button>
        <button class="nav-item" data-page="messages">💬 <span>Messages</span></button>
        <button class="nav-item" data-page="notifications">🔔 <span>Notifications</span></button>
        <button class="nav-item" data-page="profile">👤 <span>Profile</span></button>
      </nav>

      <div class="interest-box">
        <small>Your Interests</small>
        <div class="chips">
          <span>AI</span><span>AR/VR</span><span>Gaming</span>
          <span>Python</span><span>Startups</span>
        </div>
      </div>

      <button class="logout" onclick="alert('Logout can be connected to backend later.')">↪ Logout</button>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Home</h2>
          <p id="pageSubtitle">Meet people through moments, not followers.</p>
        </div>
        <div class="top-actions">
          <input id="searchInput" type="text" placeholder="Search people, rooms, interests...">
          <button onclick="navigate('notifications')">🔔</button>
          <button class="avatar" onclick="navigate('profile')">A</button>
        </div>
      </header>

      <section id="appContent"></section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
